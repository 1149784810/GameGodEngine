# =====================================================
# GameGodEngine Kubernetes 集群部署配置
# 01-configmap.yaml - 应用配置
# =====================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: gamegodengine-config
  namespace: gamegodengine
  labels:
    app.kubernetes.io/name: gamegodengine
    app.kubernetes.io/component: config
data:
  # API 服务配置
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  WORKERS: "4"
  LOG_LEVEL: "info"
  
  # Redis 配置
  REDIS_HOST: "redis-cluster"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # 数据库配置
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "gamegodengine"
  
  # WebSocket 配置
  WEBSOCKET_MAX_CONNECTIONS: "1000"
  WEBSOCKET_TIMEOUT: "3600"
  
  # 其他配置
  PROJECTS_DIR: "/app/projects"
  MAX_CONCURRENT_GAMES: "10"
