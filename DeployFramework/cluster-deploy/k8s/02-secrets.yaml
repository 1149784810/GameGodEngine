# =====================================================
# GameGodEngine Kubernetes 集群部署配置
# 02-secrets.yaml - 密钥配置
# 
# 警告：此文件包含敏感信息，请勿提交到 Git 仓库！
# 使用前请将 <your-*> 占位符替换为实际值并进行 base64 编码
# 
# 编码命令：echo -n 'your-value' | base64
# =====================================================

apiVersion: v1
kind: Secret
metadata:
  name: gamegodengine-secrets
  namespace: gamegodengine
  labels:
    app.kubernetes.io/name: gamegodengine
    app.kubernetes.io/component: secrets
type: Opaque
# 请使用以下命令生成 base64 编码值：
# echo -n 'your-openai-api-key' | base64
data:
  # OpenAI API 密钥 - 必需
  OPENAI_API_KEY: "<base64-encoded-openai-api-key>"
  
  # 数据库密码
  DB_PASSWORD: "<base64-encoded-db-password>"
  
  # Redis 密码（如启用）
  REDIS_PASSWORD: "<base64-encoded-redis-password>"
  
  # JWT 密钥
  SECRET_KEY: "<base64-encoded-jwt-secret>"

---
# 使用 stringData 的替代方案（无需手动 base64 编码）
apiVersion: v1
kind: Secret
metadata:
  name: gamegodengine-secrets-string
  namespace: gamegodengine
  labels:
    app.kubernetes.io/name: gamegodengine
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # 取消注释并填写实际值后使用
  # OPENAI_API_KEY: "sk-your-openai-api-key"
  # DB_PASSWORD: "your-database-password"
  # REDIS_PASSWORD: "your-redis-password"
  # SECRET_KEY: "your-jwt-secret-key"
